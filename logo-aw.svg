<svg width="340" height="96" viewBox="0 0 340 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ArdaWeb Logo</title>
  <desc id="desc">AW monogram and ArdaWeb wordmark for a web design and software brand.</desc>
  <defs>
    <linearGradient id="markGradient" x1="10" y1="12" x2="95" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14F1D9"/>
      <stop offset="0.48" stop-color="#2F7DFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="118" y1="20" x2="292" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.56" stop-color="#173B8F"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2F7DFF" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <path d="M18 72L38 24C40.8 17.3 50.3 17.3 53 24L72.5 72H58.4L52.8 58.4H38.1L43.2 46.4H48.2L45.5 39.9L32.3 72H18Z" fill="url(#markGradient)"/>
    <path d="M60.6 24H75.4L85.4 51.8L95.5 24H110L93.1 72H78.5L68 43.6L60.6 24Z" fill="#101B35"/>
    <path d="M67.6 72L84.1 24H96.9L80.5 72H67.6Z" fill="url(#markGradient)"/>
    <path d="M24 78H102" stroke="url(#markGradient)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="126" y="50" fill="url(#wordGradient)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="850" letter-spacing="-1.2">ArdaWeb</text>
  <text x="128" y="71" fill="#5B6B83" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="750" letter-spacing="2.6">WEB TASARIM &amp; YAZILIM</text>
